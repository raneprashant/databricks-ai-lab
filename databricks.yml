bundle:
  name: databricks-ai-lab

include:
  - resources/*.yml


variables:

  catalog:
    description: Unity Catalog catalog for Project 01
    default: payer_01_dev

  bronze_schema:
    description: Bronze schema for Project 01
    default: bronze

  silver_schema:
    description: Silver schema for Project 01
    default: silver

  gold_schema:
    description: Gold schema for Project 01
    default: gold

  landing_root:
    description: Bronze landing Volume root
    default: /Volumes/payer_01_dev/bronze/landing

  warehouse_id:
    description: SQL Warehouse used by Project 01 SQL and dashboard tasks
    default: ff718f1015c179db

targets:

  # ==========================================================
  # DEV
  # ==========================================================

  dev:

    mode: development

    default: true

    workspace:
      host: https://dbc-536d8077-bb93.cloud.databricks.com

    variables:

      catalog: payer_01_dev

      bronze_schema: bronze

      silver_schema: silver

      gold_schema: gold

      landing_root: /Volumes/payer_01_dev/bronze/landing


  # ==========================================================
  # TEST
  #
  # Same physical workspace for our learning environment,
  # but separate bundle deployment state and TEST catalog.
  # ==========================================================

  test:

    workspace:
      host: https://dbc-536d8077-bb93.cloud.databricks.com

    presets:
      name_prefix: "[TEST] "

    variables:

      catalog: payer_01_test

      bronze_schema: bronze

      silver_schema: silver

      gold_schema: gold

      landing_root: /Volumes/payer_01_test/bronze/landing


  # ==========================================================
  # PROD
  #
  # Still the same physical workspace in this lab.
  #
  # In a real enterprise implementation this target would
  # normally point to a separate PROD workspace and would use
  # production mode + service principal / controlled root path.
  # ==========================================================

  prod:

    workspace:
      host: https://dbc-536d8077-bb93.cloud.databricks.com

    presets:
      name_prefix: "[PROD] "

    variables:

      catalog: payer_01_prod

      bronze_schema: bronze

      silver_schema: silver

      gold_schema: gold

      landing_root: /Volumes/payer_01_prod/bronze/landing
