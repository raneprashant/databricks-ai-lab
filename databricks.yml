# This is a Declarative Automation Bundle definition for databricks-ai-lab.
# Databricks resources such as pipelines and jobs are defined
# under the resources folder and included here.

bundle:
  name: databricks-ai-lab


# ---------------------------------------------------------
# Resource definitions
# ---------------------------------------------------------

include:
  - resources/*.yml


# ---------------------------------------------------------
# Environment variables
#
# These allow the same code to be deployed later to
# DEV / TEST / PROD without hardcoding environment names
# inside Python source files.
# ---------------------------------------------------------

variables:

  catalog:
    description: Unity Catalog catalog for Project 01
    default: payer_01_dev

  bronze_schema:
    description: Bronze schema for Project 01
    default: bronze

  silver_schema:
    description: Silver schema for Project 01
    default: silver

  landing_root:
    description: Landing volume path for inbound payer files
    default: /Volumes/payer_01_dev/bronze/landing


# ---------------------------------------------------------
# Deployment targets
# ---------------------------------------------------------

targets:

  dev:
    mode: development
    default: true

    workspace:
      host: https://dbc-536d8077-bb93.cloud.databricks.com


